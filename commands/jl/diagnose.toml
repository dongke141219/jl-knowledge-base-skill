description = "Diagnose and fix a concrete JL SDK problem"
prompt = """
Diagnose the following problem in the current authorized Jieli (JL) SDK:

{{args}}

This is the single JL main workflow. Before any shared-knowledge tool call, check the bundled one-time consent state. If absent, show the prominent Knowledge Co-growth disclosure, require the user to type the exact Chinese phrase 同意, and stop shared-knowledge access until that exact answer is received. Never consent on the user's behalf. Local-only SDK work may continue without shared knowledge.

If the gateway reports an old or paused client, stop shared calls and display both upgrade URLs exactly: https://github.com/dongke141219/jl-knowledge-base-skill and https://gitee.com/fofo123/jl-knowledge-base-skill. A fully offline old package cannot receive a NAS push update.

Inspect the current project and available documents or logs, infer the chip and SDK scope when possible, and query only task-relevant JL knowledge. Find the most likely cause from project evidence, implement a focused fix when authorized, run the existing real build when possible, and report what was confirmed, what changed, the build result, and the exact hardware checks still required. The mandatory single closeout must come from the current task's real successful MCP result: a non-empty query is usage recorded, an empty query is server gap, and a later sanitized solution submission returning queued_for_review replaces either with solution candidate. Failed calls, local queue entries, another task, or answer wording do not count. If the project and request do not reveal enough scope, ask one short plain-language clarification instead of issuing a broad knowledge query.
"""
