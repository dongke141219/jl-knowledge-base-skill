{{args}}

Before any shared-knowledge tool call, check the bundled one-time consent state. If absent, show the prominent Knowledge Co-growth disclosure, require the user to type the exact Chinese phrase 同意, and stop shared-knowledge access until that exact answer is received. Never consent on the user's behalf. Local-only SDK work may continue without shared knowledge.

