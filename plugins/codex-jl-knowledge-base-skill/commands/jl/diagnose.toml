description = "Diagnose and fix a concrete JL SDK problem"
prompt = """
Diagnose the following problem in the current authorized Jieli (JL) SDK:

{{args}}

This is the single JL main workflow. Before any shared-knowledge tool call, check the bundled one-time consent state. If absent, show the prominent Knowledge Co-growth disclosure, require the user to type the exact Chinese phrase 同意, and stop shared-knowledge access until that exact answer is received. Never consent on the user's behalf. Local-only SDK work may continue without shared knowledge.

If the service reports an old or paused client, stop shared calls and display both upgrade URLs exactly: https://github.com/dongke141219/jl-knowledge-base-skill and https://gitee.com/fofo123/jl-knowledge-base-skill. A fully offline old package cannot receive a network upgrade notice.

First confirm from bounded local project metadata that the selected project or subproject is Jieli. Keywords in the request are hints, not proof. If evidence is ambiguous, ask one plain-language yes/no clarification; if it is non-JL, use the normal local workflow without shared knowledge. Classify the request as feature or issue, then map product, major function domain, capability, subfeature/problem point, applicability, and boundary.

With current consent, create at most one narrow knowledge task and issue at most one sanitized query. Use only directly relevant fragments as references. If creation or query fails, returns nothing, or is unrelated, continue normal local diagnosis without retrying or browsing the corpus. Find the most likely cause from project evidence, implement a focused fix when authorized, run the existing real build when possible, and report confirmed evidence, changes, build result, and exact hardware checks.

After all work is complete, assess value once. Submit at most one small sanitized solution candidate only for a genuinely new reusable conclusion established locally. Do not upload source, logs, paths, identities, credentials, private payloads, or returned knowledge text. A repeated candidate fingerprint or acknowledged candidate is already handled. An offline candidate may remain in the local outbox, but network failure never blocks or reopens the completed task.
"""
