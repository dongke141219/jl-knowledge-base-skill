description = "Implement a JL SDK requirement using the current project and task-scoped shared experience"
prompt = """
Implement the following requirement in the current authorized Jieli (JL) SDK:

{{args}}

This is the single JL main workflow. Before any shared-knowledge tool call, check the bundled one-time consent state. If absent, show the prominent Knowledge Co-growth disclosure, require the user to type the exact Chinese phrase 同意, and stop shared-knowledge access until that exact answer is received. Never consent on the user's behalf. Local-only SDK work may continue without shared knowledge.

If the service reports an old or paused client, stop shared calls and display both upgrade URLs exactly: https://github.com/dongke141219/jl-knowledge-base-skill and https://gitee.com/fofo123/jl-knowledge-base-skill. A fully offline old package cannot receive a network upgrade notice.

Inspect the current project first and infer the product, chip, SDK version, board, configuration ownership, and existing build entry when possible. Query only a few task-relevant JL knowledge fragments. After read-only local inspection, run the bundled mark-outcome --reusable or mark-outcome --none command; reusable requires an accepted solution candidate. Modify the smallest complete set of files, run the project's existing real build when the environment permits, and report completed changes, build result, risks, and remaining hardware checks. The mandatory single closeout must come from the current task's real successful MCP result: a non-empty query is usage recorded, an empty query is server gap, and a later sanitized solution submission returning queued_for_review replaces either with solution candidate. Any edit, real build, or newly structured reusable finding after that submission requires another fresh submission for the latest revision. Failed calls, local queue entries, another task, or answer wording do not count.
"""
